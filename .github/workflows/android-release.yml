name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.0.1 등 v로 시작하는 태그가 푸시될 때 실행
  workflow_dispatch: # GitHub UI에서 수동으로 실행 가능

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release를 생성하기 위한 쓰기 권한 설정

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # app 모듈의 디버그 APK 빌드
    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    # Release 자동 생성 및 APK 첨부
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/outputs/apk/debug/app-debug.apk
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Android App Release ${{ github.ref_name }}
          
          - **File**: `app-debug.apk`
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}